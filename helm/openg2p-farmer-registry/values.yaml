# Farmer Registry — values overlay for the openg2p-registry chart.
#
# This chart owns only the analytics jobs (templates/); everything else comes from
# the openg2p-registry subchart (pinned in Chart.yaml, aliased `registry`) with the
# overrides below. Install:
#
#     helm repo add openg2p https://openg2p.github.io/openg2p-helm
#     helm dependency build ./helm/openg2p-farmer-registry
#     helm install farmer-registry ./helm/openg2p-farmer-registry
#
# Two kinds of override:
#   * global.*    — Helm propagates these to the subchart (and its subcharts).
#   * registry.*  — values for the openg2p-registry subchart itself.
# Everything not set here (all service wiring, keycloak/iam, db-seed machinery,
# id-generator, demo users) is inherited from the subchart defaults.

# ── Globals (propagate to the openg2p-registry subchart) ──────────────────────
global:
  # THE single source of truth for every public hostname. Declared here as well
  # as in the openg2p-registry subchart because Helm globals flow parent -> child
  # only: without this, the parent's own templates resolve it to "" and hosts
  # render as 'fr.' with no domain at all.
  baseDomain: '{{ .Release.Namespace }}.openg2p.org'

  registryVariant: 'farmer-registry'
  # Ingress host for this registry. Overrides the subchart's generic default.
  # Derived from baseDomain (defaulted by the openg2p-registry subchart) so that
  # overriding the domain once moves every host, here and in the platform chart.
  registryHostname: '{{ .Release.Name }}.{{ tpl .Values.global.baseDomain $ }}'

  # Database wiring, mirroring openg2p-registry's own defaults. Declared here
  # rather than inherited because a parent chart's templates cannot read a
  # subchart's globals — only the other direction — and the analytics Jobs in
  # templates/ need them. The values are deliberately IDENTICAL to the subchart's,
  # so declaring them changes nothing about how the subchart resolves; drifting
  # them would point the analytics jobs at a different database than the services.
  postgresqlHost: commons-postgresql
  registryDB:  '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  registryDBPort: 5432
  registryDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  registryDBSecret: '{{ .Release.Name }}'
  registryDBUserPasswordKey: '{{ .Release.Name }}-db-user'
  masterDataDB: 'master_data'
  masterDataDBPort: 5432
  masterDataDBUser: 'master_data_user'
  # Must be 'master-data-db', NOT 'master-data': keycloak-init names its
  # client-secret Secret after the clientId, and a 'master-data' Keycloak client
  # exists. Both templates create-if-absent with resource-policy keep, so
  # whichever ran first won and the other silently skipped — leaving a Secret
  # holding only client_secret. Every consumer then failed to start with
  # "couldn't find key master-data-db-user in Secret master-data".
  # commons-services renamed it; this must match.
  masterDataDBSecret: 'master-data-db'
  masterDataDBUserPasswordKey: 'master-data-db-user'

# ── openg2p-registry subchart overrides ───────────────────────────────────────
registry:
  # Farmer-built images (each FROM the matching openg2p-registry base image).
  # CI rewrites these tags to the freshly built farmer version (lockstep); the
  # base image they extend is pinned by the openg2p-registry dependency version.
  staffApi:
    image:
      repository: openg2p/openg2p-farmer-registry-staff-api
      tag: 0.0.0-develop
  partnerApi:
    image:
      repository: openg2p/openg2p-farmer-registry-partner-api
      tag: 0.0.0-develop
  celeryWorker:
    image:
      repository: openg2p/openg2p-farmer-registry-celery
      tag: 0.0.0-develop
  celeryBeat:
    image:
      repository: openg2p/openg2p-farmer-registry-celery
      tag: 0.0.0-develop
  dbSeed:
    image:
      repository: openg2p/openg2p-farmer-registry-db-seed
      tag: 0.0.0-develop
    # The subchart defaults these OFF (minimal reference registry). Farmer ships
    # demo records/geo/images, so turn the db-seed loaders on. NB these are
    # `dbSeed.*`, not `global.*` — the db-seed Job reads .Values.dbSeed.load*
    # and there is no global fallback, so setting them under global is inert.
    # Geo is seeded by the master-data chart now (geoSeed.countryPack there),
    # not as a side effect of the registry seed. Leaving this on would load a
    # second, unrelated hierarchy over the one MDS already holds.
    loadGeoData: false
    loadSampleData: true
    loadImages: true
    loadTemplates: true
    intakeSeed:
      submitUser: alex.carter
      approver1: alex.carter
      approver2: nina.patel
      maxHouseholds: 25
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi

  # Name of this registry's tile in IAM. The roles/permissions catalog itself is
  # registry-agnostic and comes from the subchart.
  iamRegister:
    applicationDescription: "Farmer Registry"

  # Functional-ID pools, one per register. The subchart defaults to the REFERENCE
  # registry's registers (individual + household), so the farmer register must be
  # declared here. NB Helm merges maps, so `individual` is inherited too and an
  # unused pool is provisioned for it — harmless, and a parent `null` cannot
  # remove a subchart default.
  idgenerator:
    idGenerator:
      appConfig:
        idTypes:
          farmer:
            idLength: 12
          household:
            idLength: 10

  # staffUi and beneApi are consumed as-is from the openg2p-registry base images
  # (subchart defaults already point at openg2p/openg2p-registry-*), so they are
  # intentionally not overridden.

  # ── Farmer e2e sanity suite (image built here; Set 2 field tests) ───────────
  # The subchart ships the reference (Individual) sanity values; override them
  # for the Farmer register. Behaviour toggles (runE2e/failOnError) keep the
  # subchart defaults.
  sanity:
    enabled: true
    image:
      repository: openg2p/openg2p-farmer-registry-sanity-tests
      tag: 0.0.0-develop
    regType: Farmer
    regRecordType: 'spdci-extensions-dci:Farmer'
    # farmer functional_record_id of the injected sanity record (see
    # test/sanity/sanity/fixtures.py).
    searchText: SANITY-FARMER-0001
    # Consented scope + scopes asserted absent — top-level keys of the farmer
    # outgoing DCI template (openg2p_farmer_to_dci.json.j2).
    dataScopes: "farmer_personal_details"
    deniedScopes: "family_details,farm_details,machineries_details"
    # The Farmer register + the UI coordinates the change-request test edits
    # (must match the farmer-extension seed metadata).
    farmerRegisterId: a1a4d25a-1cd4-4356-abac-985a0b3c6bcd
    crTabId: "farmer_farmer_tab"
    crSectionId: "farmer_farmer_personal_identification_section_01"


  # ── Verifiable credentials (agent-issued farmer credential) ────────────────
  #
  # MASTER SWITCH: agentPortalApi.enabled.
  #   false (default) → nothing at all: no Agent Portal API, no UI, no route, no
  #                     card ConfigMap, no credential_config registration. The
  #                     farmer_vc_view is still created by the db-seed (it is a
  #                     view over existing columns and costs nothing unread), but
  #                     nothing reads it. A registry that does not issue
  #                     credentials is completely unaffected.
  #   true            → the Agent Portal is deployed. vcIssuance.enabled then
  #                     controls whether the issuance routes are mounted inside
  #                     it, so the portal can be run without issuance if ever
  #                     needed.
  #
  # Before turning it on, the environment also needs (see the VC Issuance docs):
  #   * Inji Certify installed (commons layer) and global.vcIssuer.did set to the
  #     SAME DID — the chart refuses to install with it empty;
  #   * the Keycloak `agent` realm (uncomment keycloak-init.realms.agent in the
  #     registry subchart) and iam-agent-portal-api enabled in the IAM chart;
  #   * an eSignet provider row for registrant authentication.
  agentPortalApi:
    # The farmer-built variant of the RP agent-portal-api base image: same
    # service, plus the farmer-extension, with REGISTRY_EXTENSION_MODULE baked
    # in. The RP image carries only the reference extension and would create
    # the register tables in that shape, breaking db-seed — see
    # docker/agent-portal-api/Dockerfile.
    image:
      repository: openg2p/openg2p-farmer-registry-agent-portal-api
      tag: 0.0.0-develop
    # ON by default: the Farmer Registry ships the agent portal as part of the
    # product. Set to false to remove it entirely.
    enabled: true
    vcIssuance:
      # OFF by default, and it cannot sensibly be otherwise: issuance needs
      # global.vcIssuer.did, which is environment-specific (it must equal the DID
      # configured at Inji Certify install) and has no meaningful default. The
      # chart deliberately FAILS the install if this is on with an empty DID,
      # rather than registering credential configs that sign with a blank issuer.
      #
      # To turn issuance on: set global.vcIssuer.did, then set this true.
      enabled: true
      # The register credentials are issued from. Farmer records live in the
      # Farmer register — same id the sanity suite uses.
      registerId: a1a4d25a-1cd4-4356-abac-985a0b3c6bcd
    # Checking a credential a citizen presents. Independent of issuance: unlike
    # issuance it needs no issuer DID and no per-registry configuration -- the
    # verifier resolves the issuer's key itself -- so the only requirement is
    # that openg2p-inji-verify is deployed and reachable at serviceUrl.
    #
    # ON, because verify-service now ships WITH the stack: openg2p-inji-verify is
    # a dependency of commons-services (enabled by default), the same release
    # that brings Certify. The two are halves of one feature -- an environment
    # issuing credentials is the one that wants to check them -- so defaulting
    # this off left agents without the card on a cluster that could serve it.
    #
    # Turn it off for a registry that issues but never verifies, or one pointed
    # at a commons install with openg2p-inji-verify disabled; the serviceUrl
    # above must resolve or the card refuses with G2P-VC-502 rather than
    # reporting a good credential invalid.
    vcVerification:
      enabled: true
    # Card designs shipped by this chart (templates/vc-card-templates-configmap.yaml).
    svgConfigMap: '{{ .Release.Name }}-vc-card-templates'
    pdf:
      title: "Farmer Registry Credential"
      issuerName: "Department of Agriculture"

    # The farmer credential. Identity fields only — see the header of
    # farmer-extension/.../meta_data/vc-views/farmer_vc_view.sql for why the rest
    # of the farmer profile is deliberately not on the card.
    vcDefinitions:
      - config_id: OpenG2PFarmerCredential
        credential_types: ["VerifiableCredential", "OpenG2PFarmerCredential"]
        view: farmer_vc_view
        claim_columns: ["functionalRecordId", "fullName", "dateOfBirth", "gender"]
        svg_template: farmer-card.svg
        display_name: "Farmer Credential"
        # What this registry calls the id the QR carries in claim-169's generic
        # "Data" slot. The Registry Platform cannot know it -- the same code
        # serves every manifestation -- so each registry names its own.
        qr_data_label: "Farmer ID"
        # Registered with Certify by the subchart's credential-config-register
        # Job. The issuer (DID + signing key) is added from global.vcIssuer —
        # deliberately not repeated here, since it is environment-level.
        certifyConfig:
          credentialConfigKeyId: OpenG2PFarmerCredential
          credentialFormat: ldp_vc
          credentialTypes: ["VerifiableCredential", "OpenG2PFarmerCredential"]
          contextURLs: ["https://www.w3.org/2018/credentials/v1"]
          scope: openg2p_farmer_vc_ldp
          # ── Compact claim-169 QR ──────────────────────────────────────
          # What actually goes in the printed QR. Without this Certify produces
          # no claim-169 payload, the renderer finds nothing at qr_claim_path
          # and falls back to stuffing the whole signed VC into the QR -- about
          # four times the data, and not a form Inji Verify recognises.
          #
          # The entry KEY ("claim169") names the payload. The inner keys must be
          # claim-169 attribute names from MOSIP's pixelpass mapper and nothing
          # else: "Full Name", "Date of Birth", "Gender", "Address",
          # "Phone Number", "Binary Image" (the optional photo), and so on.
          # PixelPass rewrites each label to its registry NUMBER on the way into
          # the CBOR, so an invented label is not a small liberty -- it leaves the
          # format.
          #
          # The registry has no identifier key: no ID, UIN or document number.
          # The Farmer ID therefore travels in "Data", the registry's generic
          # issuer-defined slot, paired with "Data issuer" to say whose id it is.
          # That keeps the QR strict claim-169 -- a stock Inji verifier still
          # reads it, labelled "Data" rather than "Farmer ID".
          #
          # It has to be IN here to be worth anything: the QR is the only thing an
          # offline verifier sees, so an id that lives solely in the JSON-LD
          # credential cannot be checked against the card in the field. Without
          # it a genuine QR paired with a card showing someone else's Farmer ID
          # still verifies.
          #
          # Certify exposes the signed result to the template as
          # ${claim_169_values}, which is why vcTemplateJson below reads
          # ${claim_169_values.get(0)} INSIDE credentialSubject -- the renderer
          # resolves qr_claim_path relative to the subject.
          qrSettings:
            - claim169:
                Version: '1.0'
                Language: eng
                Full Name: '${fullName}'
                Date of Birth: '${dateOfBirth}'
                Gender: '${gender}'
                # 'Data' only. NOT 'Data issuer': PixelPass numbers the Data*
                # group in its own key space (Data=0, format=1, sub format=2,
                # issuer=3), so at top level 'Data issuer' is written as key 3 --
                # which is Language. Setting it silently REPLACED the language
                # with the issuer name and lost 'eng' from every credential.
                # Verified against an issued QR; keep this to the one key.
                Data: '${functionalRecordId}'
          # COSE algorithm for the QR signature. Must be one of Certify's
          # key-alias-mapper entries: RS256 | EdDSA | ES256K | ES256.
          qrSignatureAlgo: ES256
          displayOrder: ["functionalRecordId", "fullName", "dateOfBirth", "gender"]
          metaDataDisplay:
            - name: "OpenG2P Farmer Credential"
              locale: en
          credentialSubjectDefinition:
            functionalRecordId: { display: [{ name: "Farmer ID", locale: en }] }
            fullName: { display: [{ name: "Full Name", locale: en }] }
            dateOfBirth: { display: [{ name: "Date of Birth", locale: en }] }
            gender: { display: [{ name: "Gender", locale: en }] }
          # Authored as readable JSON so a reviewer can see exactly what a farmer
          # credential contains; the register Job base64-encodes it for Certify.
          # ${_issuer} / ${_holderId} / ${validFrom} / ${validUntil} are filled by
          # Certify; the rest are the pushed claims.
          vcTemplateJson: |
            {
              "@context": [
                "https://www.w3.org/2018/credentials/v1",
                {
                  "OpenG2PFarmerCredential": "https://openg2p.org/ns#OpenG2PFarmerCredential",
                  "functionalRecordId": "https://schema.org/identifier",
                  "fullName": "https://schema.org/name",
                  "dateOfBirth": "https://schema.org/birthDate",
                  "gender": "https://schema.org/gender"
                },
                "https://w3id.org/security/suites/ed25519-2020/v1"
              ],
              "issuer": "${_issuer}",
              "type": ["VerifiableCredential", "OpenG2PFarmerCredential"],
              "issuanceDate": "${validFrom}",
              "expirationDate": "${validUntil}",
              "credentialSubject": {
                "id": "${_holderId}",
                "functionalRecordId": "${functionalRecordId}",
                "fullName": "${fullName}",
                "dateOfBirth": "${dateOfBirth}",
                "gender": "${gender}",
                "claim169": { "qrCode": "${claim_169_values.get(0)}" }
              }
            }

  # The agent's reference web portal — the only way an agent actually uses the
  # portal, so it follows the API rather than being opt-in separately.
  agentPortalUi:
    enabled: true


# ── Analytics: sample data, reporting views, dashboards ──────────────────────
# Runs after the registry db-seed (hook weight 10) as 15 -> 20 -> 30.
#
# There is deliberately no country setting here. Geography comes from whatever
# the environment's Master Data Service holds — see geoSeed.countryPack in the
# openg2p-master-data chart. Declaring a country in two charts is how registry
# records end up pointing at places MDS has never heard of.
analytics:
  # Left empty on purpose: these jobs run in the registry db-seed image and
  # inherit registry.dbSeed.image, whose tag CI rewrites to the built version.
  # Setting a tag here would pin it to a placeholder CI does not update.
  image:
    repository: ""
    tag: ""
  # No dataDir: the sample generator and its distributions are farmer's own and are
  # copied into /seed by the db-seed image. They used to be read from the shared
  # openg2p-data clone at /openg2p-data, which is what let them drift out of step
  # with the enums they write.
  waitImage: jbergknoff/postgresql-client:latest

  bulkSample:
    enabled: true
    # ~250k individuals over ~62.5k households, sized against the DEFAULT geo
    # pack (Kamuntu, 668 villages) so the deepest level averages ~90 households
    # and its percentages are reportable rather than suppressed as unreliable.
    #
    # This is the one number to revisit when changing countryPack, because the
    # denominator that matters is households *per leaf unit*, not the total. The
    # previous 50k was sized for Ethiopia's 1,148 woredas and leaves roughly a
    # dozen households each — enough for counts and rankings, too thin for rates,
    # since one household then moves a percentage by ~8 points.
    farmers: 100000
    # Optional guard: fails the job if MDS holds a different country than this
    # deployment expects. Not a selector — MDS remains the source of truth.
    #
    # This is the root unit's P-code, NOT the pack directory name: "XK" for
    # Kamuntu (pack XKM), "ET" for Ethiopia (pack ETH). The two differ because a
    # P-code is ISO alpha-2 while a pack is named by alpha-3, so setting "XKM"
    # here would abort every run.
    expectedCountry: ""

  reportingViews:
    enabled: true

    # Generate the mechanical views from the schema, after the hand-written
    # ones. Off means this registry reports on exactly the entities somebody
    # remembered to write SQL for — which is how livestock ended up with no
    # view while the register held 132,824 of them.
    generate: true

    # How often the snapshots behind the dashboards are rebuilt.
    #
    # These are MATERIALIZED views: Postgres does not update them when the
    # register changes, so without this they stay frozen at whatever the install
    # produced — new farmers simply never appear, and nothing reports an error.
    # Empty disables the CronJob and leaves the views static.
    #
    # Hourly by default. Raise the frequency for a small register; lower it if
    # the refresh starts overrunning the interval (it runs CONCURRENTLY, so it
    # costs time rather than availability).
    refreshSchedule: "0 * * * *"

    # DEVELOPMENT ONLY — override the reporting scripts from a ConfigMap.
    #
    # The reporting SQL and the platform's generator live in the db-seed image,
    # so testing a change to either normally means building and publishing an
    # image. Point this at a ConfigMap holding the files and the job runs those
    # instead, which turns a fifteen-minute pipeline into a kubectl apply.
    #
    # Empty in every real deployment: an image whose contents can be swapped
    # from outside is not an artifact you can reason about.
    devOverlay:
      configMap: ""
      files:
        - generate_reporting_views.py
        - reporting_views.sql
        - reporting.yaml

    # Which materialized views the refresh covers. Matched by prefix rather than
    # listed, so a view added to reporting_views.sql is picked up without anyone
    # remembering to add it here.
    matchPrefix: fr_rpt_

  dashboards:
    enabled: true
    image:
      repository: apachesuperset.docker.scarf.sh/apache/superset
      tag: 4.0.1
    # Service account that owns imported assets. On a Keycloak-only Superset no
    # local user exists until someone logs in, so the Job creates this one if
    # absent. It cannot log in through the UI — AUTH_OAUTH removes the local
    # login form — but see the password below: it can still use the REST API.
    supersetAdmin: svc-importer
    # Password for that account, read from a Secret. Leave the secret name empty
    # and the Job generates a random password and discards it, which is fine if
    # the account only ever needs to own assets.
    #
    # Set it when anything has to call the Superset API as a machine, which is
    # what G2P Insight's Dashboards tab does. Under AUTH_TYPE = AUTH_OAUTH this
    # is the ONLY way in: POST /login/ is a browser redirect to Keycloak and
    # returns 405 to a form post, and /api/v1/security/login authenticates
    # against Superset's OWN user table — provider=db never consults Keycloak, so
    # no Keycloak credential, however privileged, can authenticate a service.
    #
    # When set, the Job converges the account onto this password on every run,
    # so rotating the Secret and upgrading is enough to rotate the credential.
    supersetAdminPasswordSecret:
      # Generated on first install and adopted thereafter, so nobody has to
      # invent one. Whichever of FR and G2P Insights installs first creates it;
      # the other adopts it, which is why both charts default to the same name
      # and key. Set generate=false and create the Secret yourself if your
      # pipeline renders manifests and applies them (helm template / --dry-run
      # cannot read the cluster, so it would mint a new password every render).
      generate: true
      name: openg2p-insights-superset-svc
      key: password
    # database_name of the connection inside Superset, as recorded in the bundle
    supersetDatabaseName: FR

    # Superset's OWN configuration. This job runs Superset's CLI and ORM
    # (`superset fab`, `create_app()`, `import-dashboards`), so it must be
    # pointed at the SAME metadata database Superset itself uses.
    #
    # Without these it was pointed at nothing: Superset defaults
    # SQLALCHEMY_DATABASE_URI to a SQLite file, so the job created its service
    # account and imported all 8 dashboards into a throwaway database inside its
    # own pod, exited 0, and left the real Superset empty. A successful install
    # with no dashboards in it. The job now aborts rather than repeat that.
    #
    # Defaults match the commons-services Superset chart; override for a Superset
    # deployed under another name.
    superset:
      # In-cluster base URL, used for the REST calls that enable embedding.
      url: http://commons-services-superset:8088
      # Superset is a different Helm release, so nothing orders it against this
      # Job. Wait rather than fail: a Superset merely restarting would otherwise
      # take the whole dashboard import down with it.
      # Superset is a SEPARATE Helm release and analytics is optional, so an
      # absent Superset SKIPS the dashboard import rather than failing the
      # install: a registry must come up whether or not a reporting stack was
      # deployed beside it. Set true where the dashboards are load-bearing and a
      # silent skip would be worse than a failed deploy.
      required: false
      waitAttempts: 60
      waitSeconds: 5
      # Secret carrying Superset's DB_HOST/DB_NAME/DB_USER/DB_PASS.
      envFromSecret: commons-services-superset-env
      # ...except DB_PASS, which in that Secret is EMPTY. The Superset chart keeps
      # the password in a Secret of its own and injects it as an explicit `env:`
      # entry, which takes precedence over the same key coming from `envFrom`.
      # Copying only the envFrom half therefore produced a URI with no password and
      # the CLI died on `fe_sendauth: no password supplied` — after waiting for
      # Superset, after installing authlib, so the log looked like it was working
      # right up to the point it wasn't. Rendered as an explicit env var here for
      # the same reason: it has to win over the blank one.
      dbPasswordSecret:
        name: superset-db-user
        key: superset-db-user-password
      # Secret carrying superset_config.py (AUTH_TYPE, SECRET_KEY, the DB URI).
      configSecret: commons-services-superset-config
      configKey: superset_config.py
      # Sourced before the Superset CLI runs, exactly as the Superset deployment
      # does before starting. It installs what the mounted config needs — authlib
      # for AUTH_OAUTH — which the stock apache/superset image does not ship.
      # Without it this Job died in create_app with ModuleNotFoundError, before
      # importing a single dashboard. Set empty to skip.
      bootstrapKey: superset_bootstrap.sh
      # Enable embedding on the imported dashboards. Without this they exist and
      # are published but carry no embedded UUID, so G2P Insights' Dashboards tab
      # lists them and can render none of them.
      enableEmbedding: true
    # ConfigMap holding fr-dashboards.zip; defaults to <release>-nsr-dashboard-bundle
    bundleConfigMap: ""

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 2Gi

# ── Maps content for G2P Insights ────────────────────────────────────────────
# The queries and page this registry contributes to the Insights map surface,
# published as a ConfigMap for Insights to mount. See
# templates/maps-content-configmap.yaml for why this is configuration and not
# an image.
#
# Harmless when Insights is not installed: nothing else reads it.
mapsContent:
  enabled: true
  # Defaults to <release>-maps-content. Whatever this resolves to is what goes
  # into the Insights chart as insightMaps.build.content.configMap.
  nameOverride: ""
